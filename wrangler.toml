# Cloudflare Workers static-assets config for tickets-please.
# Pure static site (no Worker script): the built dist/ is served from the edge.
name = "tickets-please"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Unknown paths fall back to the app shell (harmless for this single-page app).
not_found_handling = "single-page-application"
