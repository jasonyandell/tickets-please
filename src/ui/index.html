<!doctype html>
<!--
  tickets-please — browser entry point. Zero dependency: loads the ES-module UI
  controller (main.js), which imports the engine and AI directly. No bundler.
  The UI controller binds to #board (canvas) and #panel (side panel).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tickets-please 🚂</title>
    <meta
      name="description"
      content="A free, public-domain Ticket to Ride-style railway game. Zero dependencies."
    />
    <!-- Inline data-URI favicon (a train) — avoids a /favicon.ico network request entirely. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%9A%82%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="map" width="1200" height="760"></canvas>
      <aside id="panel"></aside>
    </main>
    <noscript>tickets-please needs JavaScript enabled to play.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
